<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stay informed with News Explorer, your go-to source for the latest news, updates, and in-depth analysis on global events, technology, politics, and more. Explore breaking stories and trending topics today!">
  <meta name="keywords" content="News Explorer, latest news, breaking news, global news, technology news, politics, trending topics, news updates, in-depth analysis, current events">

  <title>News Explorer - Latest Breaking News, Global Updates, and In-Depth Analysis</title>

  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #fff;
      margin: 0;
      color: #222;
    }
    header {
      background-color: #fff;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #000;
    }
    header h1 {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 2px;
    }
    nav {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }
    nav a {
      color: black;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    nav a:hover {
      text-decoration: underline;
    }

    .main-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 20px;
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* Post Item */
    .post-item {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .post-item h2 {
      font-size: 16px;
      text-align: center;
      margin: 0;
    }
    .post-item h2 a {
      color: black;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
    }
    .post-item h2 a:hover {
      text-decoration: underline;
    }

    /* Loading Text */
    .loading {
      text-align: center;
      font-size: 18px;
      margin: 20px 0;
    }

    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }

    /* Modal Popup */
    #post {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup-content {
      background: #fff;
      padding: 20px;
      width: 80%;
      max-width: 600px;
      border-radius: 10px;
      text-align: center;
    }
    .popup-content h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .popup-content .meta {
      margin-bottom: 10px;
      color: #555;
    }
    .popup-content a {
      color: #000;
      text-decoration: none;
    }
    .close-popup {
      cursor: pointer;
      font-size: 18px;
      color: red;
      padding: 5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>news explorer</h1>
  </header>

  <nav>
    <a href="https://giantwebmarket.com/news-explorer/index.html" class="link-style">home</a>
    <a href="https://giantwebmarket.com/privacy-policy.html" class="link-style">privacy policy</a>
  </nav>

  <div class="main-container" id="postsContainer"></div>
  <div class="loading" id="loadingMessage" style="display: none;">Loading...</div>

  <footer>
    &copy; 2025 news explorer by giantwebmarket.com . All Rights Reserved.
  </footer>

  <!-- Modal for displaying post details -->
  <div id="post">
    <div class="popup-content">
      <h2 id="popupTitle"></h2>
      <p id="popupMeta" class="meta"></p>
      <a id="popupOriginalLink" target="_blank">Visit Original Article</a><br>
      <a id="popupShareLink" target="_blank">Share This Article</a>
      <br><br>
      <span class="close-popup">Close</span>
    </div>
  </div>

  <script>
    let allPosts = [];
    let currentPostIndex = 0;
    const postsPerPage = 20;

    function fetchRssFeed() {
      const rssUrls = [
        'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml',
        'https://feeds.bbci.co.uk/news/rss.xml',
        'https://rss.cnn.com/rss/cnn_topstories.rss',
        'https://feeds.skynews.com/feeds/rss/home.xml',
        'https://www.theguardian.com/world/rss',
        'https://www.reuters.com/rssFeed/topNews',
        'https://www.aljazeera.com/xml/rss/all.xml',
        'https://www.abc.net.au/news/feed/51120/rss.xml',
        'https://www.bbc.com/news/10628494',
        'https://www.npr.org/rss/rss.php?id=1001',
        'https://www.washingtonpost.com/rss/',
        'https://www.cnbc.com/id/100003114/device/rss/rss.html',
        'https://www.bloomberg.com/feed/podcast/etf-report.xml',
        'https://www.mashable.com/feed',
        'https://www.politico.com/rss/politics07.rss',
        'https://www.huffpost.com/section/front-page/feed',
        'https://www.wired.com/feed/',
        'https://www.theverge.com/rss/index.xml',
        'https://www.techcrunch.com/feed/',
        'https://www.bbc.com/news/technology/rss.xml',
        'https://www.nytimes.com/svc/collections/v1/publish/technology/rss.xml',
        'https://www.vanityfair.com/feed',
        'https://www.nationalgeographic.com/feed/',
        'https://www.scientificamerican.com/feed/',
        'https://www.smithsonianmag.com/rss/',
        'https://www.cbsnews.com/latest/rss/main',
        'https://www.entrepreneur.com/latest/rss',
        'https://www.reddit.com/r/worldnews/.rss',
        'https://www.sportingnews.com/us/rss',
        'https://www.wsj.com/articles/rss',
        'https://www.marketwatch.com/rss',
        'https://www.nbcnews.com/rss',
        'https://www.economist.com/feeds/weekly',
        'https://www.bbc.co.uk/sport/rss.xml',
        'https://www.politico.com/rss/politics10.rss',
        'https://www.motherjones.com/feed/',
        'https://www.theatlantic.com/feed/',
        'https://www.rollingstone.com/feed/',
        'https://www.fortune.com/feed/',
        'https://www.cultofmac.com/feed/',
        'https://www.npr.org/rss/rss.php?id=2000',
        'https://www.digitaltrends.com/feed/',
        'https://www.slate.com/blogs/feed/',
        'https://www.cracked.com/rss/',
        'https://www.filmfreakcentral.net/ffc/feed/',
        'https://www.dailystar.co.uk/news/rss/',
        'https://www.newsweek.com/rss/',
        'https://www.eurekalert.org/rss.xml',
        'https://www.pbs.org/newshour/rss',
        'https://www.rte.ie/news/rss.xml',
        'https://www.weather.com/rss',
        'https://www.popularmechanics.com/rss/',
        'https://www.filmthreat.com/feed/',
        'https://www.iflscience.com/rss/',
        'https://www.khanacademy.org/rss',
        'https://www.thedailybeast.com/feed/',
        'https://www.nydailynews.com/syndication/rss.xml',
        'https://www.abcnews.go.com/abcnews/topstories',
        'https://www.nationalreview.com/feed/',
        'https://www.dailywire.com/rss',
        'https://www.michaelhyatt.com/feed/',
        'https://www.allaboutbirds.org/feeds/rss/',
        'https://www.thechive.com/feed/',
        'https://www.vulture.com/feed/',
        'https://www.news.com.au/national/feed/',
        'https://www.thedrum.com/rss',
        'https://www.foxnews.com/rss',
        'https://www.newscientist.com/feed/',
        'https://www.npr.org/sections/health/rss.xml',
        'https://www.cookinglight.com/rss',
        'https://www.washingtonexaminer.com/rss',
        'https://www.realsimple.com/rss',
        'https://www.marieclaire.com/feed/',
        'https://www.thecut.com/feed/',
        'https://www.mentalfloss.com/rss/',
        'https://www.menshealth.com/rss',
        'https://www.wellandgood.com/rss'
      ];

      rssUrls.forEach(url => {
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
          .then(response => response.json())
          .then(data => {
            const posts = data.items.map(item => ({
              title: item.title,
              link: item.link,
              pubDate: item.pubDate,
              source: new URL(item.link).hostname
            }));
            allPosts.push(...posts);
            renderPosts();
          })
          .catch(error => console.error('Error fetching RSS feed:', error));
      });
    }

    function renderPosts() {
      const mainContainer = document.getElementById('postsContainer');
      const loadingMessage = document.getElementById('loadingMessage');
      loadingMessage.style.display = 'block';

      const nextPosts = allPosts.slice(currentPostIndex, currentPostIndex + postsPerPage);

      nextPosts.forEach(post => {
        const div = document.createElement('div');
        div.classList.add('post-item');

        const title = document.createElement('h2');
        const link = document.createElement('a');
        link.href = "#";  // For popup (not redirecting to post.html yet)
        link.textContent = post.title;
        link.onclick = () => openPostPopup(post);

        title.appendChild(link);
        div.appendChild(title);
        mainContainer.appendChild(div);
      });

      currentPostIndex += postsPerPage;

      if (currentPostIndex >= allPosts.length) {
        window.removeEventListener('scroll', onScroll);
      }

      loadingMessage.style.display = 'none';
    }

    function openPostPopup(post) {
      const popup = document.getElementById('post');
      const popupTitle = document.getElementById('popupTitle');
      const popupMeta = document.getElementById('popupMeta');
      const popupOriginalLink = document.getElementById('popupOriginalLink');
      const popupShareLink = document.getElementById('popupShareLink');

      popupTitle.textContent = post.title;
      popupMeta.textContent = `Source: ${post.source} | Published: ${new Date(post.pubDate).toLocaleString()}`;
      popupOriginalLink.href = post.link;
      popupShareLink.href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(post.link)}&text=${encodeURIComponent(post.title)}`;

      popup.style.display = 'flex';

      document.querySelector('.close-popup').addEventListener('click', () => {
        popup.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === popup) {
          popup.style.display = 'none';
        }
      });
    }

    function onScroll() {
      const scrollPosition = window.innerHeight + window.scrollY;
      const documentHeight = document.documentElement.offsetHeight;

      if (scrollPosition >= documentHeight) {
        renderPosts();
      }
    }

    window.onload = () => {
      fetchRssFeed();
      window.addEventListener('scroll', onScroll);
    };
  </script>

</body>
</html>
