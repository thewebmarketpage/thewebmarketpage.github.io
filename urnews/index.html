<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stay informed with News Explorer, your go-to source for the latest news, updates, and in-depth analysis on global events, technology, politics, and more. Explore breaking stories and trending topics today!">
  <meta name="keywords" content="News Explorer, latest news, breaking news, global news, technology news, politics, trending topics, news updates, in-depth analysis, current events">
  <title>News Explorer - Latest Breaking News, Global Updates, and In-Depth Analysis</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #fff;
      margin: 0;
      color: #222;
    }
    header {
      background-color: #fff;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #000;
    }
    header h1 {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 2px;
    }
    nav {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }
    nav a {
      color: black;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    nav a:hover {
      text-decoration: underline;
    }

    .main-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 20px;
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .post-item {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .post-item h2 {
      font-size: 16px;
      text-align: center;
      margin: 0;
    }
    .post-item h2 a {
      color: black;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
    }
    .post-item h2 a:hover {
      text-decoration: underline;
    }

    /* Popup Styling */
    #post {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup-content {
      background-color: #fff;
      padding: 20px;
      width: 80%;
      max-width: 600px;
      border-radius: 5px;
      position: relative;
    }
    .popup-content h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }
    .popup-content .meta-info {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }
    .close-popup {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 20px;
      cursor: pointer;
    }
    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>news explorer</h1>
  </header>

  <nav>
    <a href="index.html">home</a>
    <a href="https://giantwebmarket.com/privacy-policy.html">privacy policy</a>
  </nav>

  <div class="main-container" id="postsContainer"></div>
  
  <!-- Popup Container -->
  <div id="post">
    <div class="popup-content">
      <span class="close-popup">&times;</span>
      <h2 id="popupTitle">Loading...</h2>
      <div class="meta-info" id="popupMeta"></div>
      <a id="popupOriginalLink" target="_blank" class="popup-link">Read Original Article</a>
      <a id="popupShareLink" target="_blank" class="popup-link">Share This Article</a>
    </div>
  </div>

  <footer>
    &copy; 2025 news explorer by giantwebmarket.com . All Rights Reserved.
  </footer>

  <script>
    let allPosts = [];
    let currentPostIndex = 0;
    const postsPerPage = 20;

    // Load Posts from RSS Feeds
    function loadPosts() {
      // Replace with the RSS URL you want to fetch
      const rssFeedUrls = [
        'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml',
        'https://feeds.bbci.co.uk/news/rss.xml',
        'https://www.theguardian.com/world/rss',
        // Add more RSS feeds here
      ];

      Promise.all(rssFeedUrls.map(url => fetchRSS(url)))
        .then(responses => {
          allPosts = responses.flat(); // Flatten the array of posts from multiple RSS feeds
          renderPosts();
        })
        .catch(error => {
          console.error('Error fetching RSS feeds:', error);
        });
    }

    // Fetch and parse RSS
    function fetchRSS(url) {
      return fetch(url)
        .then(response => response.text())
        .then(str => (new window.DOMParser()).parseFromString(str, 'text/xml'))
        .then(data => {
          const items = data.querySelectorAll('item');
          const posts = Array.from(items).map(item => ({
            title: item.querySelector('title').textContent,
            link: item.querySelector('link').textContent,
            pubDate: item.querySelector('pubDate').textContent,
            source: item.querySelector('source') ? item.querySelector('source').textContent : new URL(item.querySelector('link').textContent).hostname
          }));
          return posts;
        });
    }

    // Render Posts
    function renderPosts() {
      const mainContainer = document.getElementById('postsContainer');
      mainContainer.innerHTML = ''; // Clear any previous posts

      // Calculate the next batch of posts to render
      const nextPosts = allPosts.slice(currentPostIndex, currentPostIndex + postsPerPage);

      nextPosts.forEach(post => {
        const div = document.createElement('div');
        div.classList.add('post-item');

        const title = document.createElement('h2');
        const link = document.createElement('a');
        link.href = "#";
        link.textContent = post.title;
        link.onclick = function() { openPostPopup(post); };

        title.appendChild(link);
        div.appendChild(title);
        mainContainer.appendChild(div);
      });

      currentPostIndex += postsPerPage;
    }

    // Open Post Popup
    function openPostPopup(post) {
      const popup = document.getElementById('post');
      const popupTitle = document.getElementById('popupTitle');
      const popupMeta = document.getElementById('popupMeta');
      const popupOriginalLink = document.getElementById('popupOriginalLink');
      const popupShareLink = document.getElementById('popupShareLink');

      // Set popup content
      popupTitle.textContent = post.title;
      popupMeta.textContent = `Source: ${post.source} | Published: ${new Date(post.pubDate).toLocaleString()}`;
      popupOriginalLink.href = post.link;
      popupShareLink.href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(post.link)}&text=${encodeURIComponent(post.title)}`;

      // Show popup
      popup.style.display = 'flex';

      // Close popup when clicked outside or on close button
      document.querySelector('.close-popup').addEventListener('click', () => {
        popup.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === popup) {
          popup.style.display = 'none';
        }
      });
    }

    window.onload = loadPosts;
  </script>
</body>
</html>
