<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>URNEWS - Integrated View</title>
</head>
<body>
  <div id="wp-content">Loading WordPress content...</div>

  <script>
    fetch("https://tip-dakota-gamma-evidence.trycloudflare.com/")
      .then(res => res.text())
      .then(html => {
        document.getElementById("wp-content").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("wp-content").innerHTML = "Failed to load content.";
        console.error(err);
      });
  </script>
</body>
</html>
