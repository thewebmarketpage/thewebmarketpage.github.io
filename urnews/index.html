  <style>

<body>

  <header>
    <h1>news explorer</h1>
  </header>

  <nav>
    <a href="https://giantwebmarket.com/news-explorer/index.html" class="link-style">home</a>
    <a href="https://giantwebmarket.com/privacy-policy.html" class="link-style">privacy policy</a>
  </nav>

  <div class="main-container" id="postsContainer"></div>
  <div class="loading" id="loadingMessage" style="display: none;">Loading...</div>
  <button class="show-more-btn" id="showMoreButton" style="display: none;">Show More</button>

  <footer>
    &copy; 2025 news explorer by giantwebmarket.com . All Rights Reserved.
  </footer>

  <script>
    const RSS_FEEDS = [
      'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml',
      'http://feeds.reuters.com/reuters/topNews',
      'http://feeds.bbci.co.uk/news/world/rss.xml',
      'https://www.theguardian.com/world/rss',
      'https://feeds.a.dj.com/rss/RSSWorldNews.xml',
      'https://www.aljazeera.com/xml/rss/all.xml',
      'https://www.npr.org/rss/rss.php?id=1001',
      'https://www.politico.com/rss/politics08.xml',
      'https://rss.cnn.com/rss/edition.rss',
      'https://feeds.skynews.com/feeds/rss/world.xml'
    ];

    const postsContainer = document.getElementById('postsContainer');
    const loadingMessage = document.getElementById('loadingMessage');

    async function loadAllFeeds() {
      loadingMessage.style.display = 'block';
      const allItems = [];

      for (const url of RSS_FEEDS) {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
          const response = await fetch(apiUrl);
          const data = await response.json();
          if (data.status === 'ok') {
            allItems.push(...data.items);
          }
        } catch (error) {
          console.error('Error fetching feed:', url, error);
        }
      }

      allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      renderPosts(allItems.slice(0, 100)); // Show top 100 posts max
    }

    function renderPosts(items) {
      loadingMessage.style.display = 'none';

      items.forEach(item => {
        const div = document.createElement('div');
        div.classList.add('post-item');

        const title = document.createElement('h2');
        const link = document.createElement('a');
        const encodedId = encodeURIComponent(btoa(item.link));
        link.href = `post.html?id=${encodedId}`;
        link.textContent = item.title;

        title.appendChild(link);
        div.appendChild(title);
        postsContainer.appendChild(div);
      });
    }

    window.onload = loadAllFeeds;
  </script>

  <script async type="application/javascript" src="https://news.google.com/swg/js/v1/swg-basic.js"></script>
  <script>
    (self.SWG_BASIC = self.SWG_BASIC || []).push(basicSubscriptions => {
      basicSubscriptions.init({
        type: "NewsArticle",
        isPartOfType: ["Product"],
        isPartOfProductId: "CAow3fK4DA:openaccess",
        clientOptions: { theme: "light", lang: "en" },
      });
    });
  </script>
</body>
