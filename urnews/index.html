<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URNEWS - Real-Time Global News & Market Insights</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #content {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script>
    fetch('https://tip-dakota-gamma-evidence.trycloudflare.com/')
      .then(response => response.text())
      .then(data => {
        document.getElementById('content').innerHTML = data;
      })
      .catch(error => {
        console.error('Error loading content:', error);
      });
  </script>
</body>
</html>
