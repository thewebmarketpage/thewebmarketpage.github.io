  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #fff;
      margin: 0;
      color: #222;
    }
    header {
      background-color: #fff;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #000;
    }
    header h1 {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 2px;
    }
    nav {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }
    nav a {
      color: black;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    nav a:hover {
      text-decoration: underline;
    }

    .main-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 20px;
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* Post Item */
    .post-item {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .post-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .post-item h2 {
      font-size: 16px;
      text-align: center;
      margin: 0;
    }
    .post-item h2 a {
      color: black;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
    }
    .post-item h2 a:hover {
      text-decoration: underline;
    }

    /* Loading Text */
    .loading {
      text-align: center;
      font-size: 18px;
      margin: 20px 0;
    }

    /* Show More Button */
    .show-more-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #000;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      font-weight: bold;
    }

    .show-more-btn:hover {
      background-color: #333;
    }

    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>news explorer</h1>
  </header>

  <nav>
    <a href="https://giantwebmarket.com/news-explorer/index.html" class="link-style">home</a>
    <a href="https://giantwebmarket.com/privacy-policy.html" class="link-style">privacy policy</a>
  </nav>

  <div class="main-container" id="postsContainer"></div>
  <div class="loading" id="loadingMessage" style="display: none;">Loading...</div>
  <button class="show-more-btn" id="showMoreButton">Show More</button>

  <footer>
    &copy; 2025 news explorer by giantwebmarket.com . All Rights Reserved.
  </footer>

  <script>
    let allPosts = [];
    let currentPostIndex = 0;
    const postsPerPage = 20;

    function loadPosts() {
      fetch('/data.json')
        .then(response => response.json())
        .then(posts => {
          allPosts = posts;
          renderPosts();
        })
        .catch(error => {
          console.error('Error fetching posts:', error);
        });
    }

    function renderPosts() {
      const mainContainer = document.getElementById('postsContainer');
      const loadingMessage = document.getElementById('loadingMessage');

      // Show loading message while rendering posts
      loadingMessage.style.display = 'block';

      // Calculate the next batch of posts to render
      const nextPosts = allPosts.slice(currentPostIndex, currentPostIndex + postsPerPage);

      nextPosts.forEach(post => {
        const div = document.createElement('div');
        div.classList.add('post-item');

        const img = document.createElement('img');
        img.src = post.image || '';
        img.alt = post.title;

        const title = document.createElement('h2');
        const link = document.createElement('a');
        link.href = `https://giantwebmarket.com/news-explorer/post.html?id=${post.id}`;
        link.textContent = post.title;

        title.appendChild(link);
        div.appendChild(img);
        div.appendChild(title);
        mainContainer.appendChild(div);
      });

      // Update the current index for next batch
      currentPostIndex += postsPerPage;

      // Hide the loading message
      loadingMessage.style.display = 'none';

      // If there are no more posts, hide the "Show More" button
      if (currentPostIndex >= allPosts.length) {
        document.getElementById('showMoreButton').style.display = 'none';
      }
    }

    // Handle show more button click
    document.getElementById('showMoreButton').addEventListener('click', renderPosts);

    window.onload = loadPosts;
  </script>
<script async type="application/javascript"
        src="https://news.google.com/swg/js/v1/swg-basic.js"></script>
<script>
  (self.SWG_BASIC = self.SWG_BASIC || []).push( basicSubscriptions => {
    basicSubscriptions.init({
      type: "NewsArticle",
      isPartOfType: ["Product"],
      isPartOfProductId: "CAow3fK4DA:openaccess",
      clientOptions: { theme: "light", lang: "en" },
    });
  });
</script>
</body>
</html>
