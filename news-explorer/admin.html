<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .delete-button {
            background-color: red;
            margin-top: 10px;
        }
        .delete-button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <h1>Admin Panel</h1>

    <h2>Posts</h2>
    <table id="postsTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Image</th>
                <th>Content</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Posts will be dynamically loaded here -->
        </tbody>
    </table>

    <script>
        // Function to fetch the data from data.json and display it
        function fetchPosts() {
            fetch('/data.json')
                .then(response => response.json())
                .then(posts => {
                    const postsTableBody = document.querySelector('#postsTable tbody');
                    postsTableBody.innerHTML = '';  // Clear the table

                    // Loop through each post and create table rows dynamically
                    posts.forEach(post => {
                        const row = document.createElement('tr');
                        
                        row.innerHTML = `
                            <td>${post.title}</td>
                            <td><img src="${post.image}" alt="Post Image" style="width: 100px; height: auto;"></td>
                            <td>${post.content || 'No content available'}</td>
                            <td>
                                <button class="delete-button" onclick="deletePost('${post.id}')">Delete</button>
                            </td>
                        `;

                        postsTableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error fetching posts:', error);
                });
        }

        // Function to delete a post
        function deletePost(postId) {
            if (confirm('Are you sure you want to delete this post?')) {
                fetch('/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: postId })
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('Post deleted successfully');
                        fetchPosts();  // Refresh the posts list
                    } else {
                        alert('Error deleting post');
                    }
                })
                .catch(error => {
                    console.error('Error deleting post:', error);
                });
            }
        }

        // Fetch posts when the page loads
        window.onload = fetchPosts;
        
        // Optionally, you can set a periodic refresh (for real-time updates)
        setInterval(fetchPosts, 5000); // Refresh every 5 seconds (5000 ms)
    </script>

</body>
</html>
