<!DOCTYPE html>
<html>
<head>
  <title>Browser System Info</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    h1 { color: #0ff; }
    .info { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Browser System Info</h1>

  <div class="info">🌐 Public IP: <span id="public-ip">Loading...</span></div>
  <div class="info">🏠 Local IP: <span id="local-ip">Loading...</span></div>
  <div class="info">🧠 OS & Browser: <pre id="ua"></pre></div>
  <div class="info">🚪 Open Ports on localhost:</div>
  <pre id="port-scan">Scanning...</pre>

  <script>
    // User Agent
    document.getElementById('ua').textContent = navigator.userAgent;

    // Public IP
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => document.getElementById('public-ip').textContent = data.ip)
      .catch(() => document.getElementById('public-ip').textContent = 'Error');

    // Local IP (WebRTC)
    function getLocalIP(callback) {
      const rtc = new RTCPeerConnection({ iceServers: [] });
      rtc.createDataChannel('');
      rtc.createOffer()
        .then(offer => rtc.setLocalDescription(offer))
        .catch(console.error);

      rtc.onicecandidate = (event) => {
        if (event?.candidate?.candidate) {
          const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(event.candidate.candidate);
          if (ipMatch) {
            callback(ipMatch[1]);
            rtc.onicecandidate = null;
          }
        }
      };
    }

    getLocalIP(ip => {
      document.getElementById('local-ip').textContent = ip;
    });

    // Port Scan (localhost)
    const ports = [21, 22, 23, 25, 53, 80, 110, 139, 143, 443, 445, 3306, 8080];
    const results = [];

    async function scanPort(port) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ port, open: true });
        img.onerror = () => resolve({ port, open: false });

        img.src = `http://giantwebmarket.com:${port}/favicon.ico?` + new Date().getTime();
        setTimeout(() => resolve({ port, open: false }), 1000); // timeout
      });
    }

    (async () => {
      const output = document.getElementById('port-scan');
      for (let port of ports) {
        const res = await scanPort(port);
        results.push(res);
        output.textContent += `Port ${res.port}: ${res.open ? '✅ OPEN' : '❌ closed'}\n`;
      }
    })();
  </script>
</body>
</html>
