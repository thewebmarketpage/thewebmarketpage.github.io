<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Browser Terminal</title>
  <style>
    body {
      font-family: monospace;
      background-color: #111;
      color: #0f0;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      color: #0ff;
      text-align: center;
    }
    .terminal {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 10px;
      background-color: #111;
    }
    .file-item {
      cursor: pointer;
      user-select: none;
    }
    .file-item:hover {
      background-color: #333;
    }
    input {
      background: none;
      border: none;
      color: #0f0;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <h1>Browser Terminal</h1>
    <div id="output"></div>
    <div id="input-wrapper">
      <input id="input" type="text" autofocus placeholder="Type a command..." />
    </div>
  </div>

  <script>
    let fs = JSON.parse(localStorage.getItem('fs')) || {
      '/': {
        type: 'dir',
        contents: {
          'home': { type: 'dir', contents: {} },
          'readme.txt': { type: 'file', content: 'Welcome to the browser terminal!' }
        }
      }
    };

    let currentPath = ['/'];
    const terminal = document.getElementById('output');
    const inputElement = document.getElementById('input');
    const inputWrapper = document.getElementById('input-wrapper');

    function getCurrentDir() {
      return currentPath.reduce((dir, name) => dir.contents[name], fs);
    }

    function saveFileSystem() {
      localStorage.setItem('fs', JSON.stringify(fs));
    }

    function renderDirContents() {
      const dir = getCurrentDir();
      return Object.entries(dir.contents).map(([name, item]) => {
        const isDir = item.type === 'dir';
        return `<div class="file-item" id="${name}" onclick="changeDir('${name}')">
                  ${isDir ? '📁' : '📄'} ${name}
                </div>`;
      }).join('');
    }

    function changeDir(name) {
      const dir = getCurrentDir().contents[name];
      if (dir && dir.type === 'dir') {
        currentPath.push(name);
        renderTerminal();
      }
    }

    function handleOutput(cmd, output) {
      const outputElement = document.createElement('pre');
      outputElement.textContent = `${cmd}\n${output}`;
      terminal.appendChild(outputElement);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function handleCommand(cmd) {
      const args = cmd.trim().split(' ');
      const command = args[0];
      const result = { ls, cd, mkdir, touch, rm, cat, tree }[command];
      if (result) return result(args);
      return `Command not found: ${command}`;
    }

    function ls(args) {
      return renderDirContents();
    }

    function cd(args) {
      const dirName = args[1];
      const dir = getCurrentDir().contents[dirName];
      if (dir && dir.type === 'dir') {
        currentPath.push(dirName);
        return '';
      }
      return 'No such directory';
    }

    function mkdir(args) {
      const name = args[1];
      if (!name) return 'Usage: mkdir [foldername]';
      getCurrentDir().contents[name] = { type: 'dir', contents: {} };
      saveFileSystem();
      return '';
    }

    function touch(args) {
      const name = args[1];
      if (!name) return 'Usage: touch [filename]';
      getCurrentDir().contents[name] = { type: 'file', content: '' };
      saveFileSystem();
      return '';
    }

    function rm(args) {
      const name = args[1];
      if (!name) return 'Usage: rm [filename]';
      const dir = getCurrentDir();
      delete dir.contents[name];
      saveFileSystem();
      return '';
    }

    function cat(args) {
      const name = args[1];
      const file = getCurrentDir().contents[name];
      if (file && file.type === 'file') {
        return file.content;
      }
      return 'No such file';
    }

    function tree(args) {
      return renderTree(getCurrentDir(), 0);
    }

    function renderTree(dir, level) {
      const indent = '  '.repeat(level);
      let output = '';
      Object.entries(dir.contents).forEach(([name, item]) => {
        output += `${indent}${item.type === 'dir' ? '📁' : '📄'} ${name}\n`;
        if (item.type === 'dir') output += renderTree(item, level + 1);
      });
      return output;
    }

    function renderTerminal() {
      terminal.innerHTML = renderDirContents();
      terminal.insertBefore(inputWrapper, terminal.lastElementChild);
      inputElement.focus();
      makeDraggable();
    }

    function makeDraggable() {
      const files = document.querySelectorAll('.file-item');
      files.forEach(file => {
        file.setAttribute('draggable', 'true');
        file.addEventListener('dragstart', dragStart);
        file.addEventListener('dragover', dragOver);
        file.addEventListener('drop', dropFile);
      });
    }

    function dragStart(e) {
      e.dataTransfer.setData('text/plain', e.target.id);
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function dropFile(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const fileElement = document.getElementById(id);
      const targetDir = e.target;  // Drop target
      // Handle file moving logic here
    }

    inputElement.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const cmd = inputElement.value.trim();
        const output = handleCommand(cmd);
        handleOutput(cmd, output);
        inputElement.value = '';
        terminal.scrollTop = terminal.scrollHeight;
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const cmd = inputElement.value.trim();
        const parts = cmd.split(' ');
        const dir = getCurrentDir();
        
        if (parts[0] === 'cd' || parts[0] === 'ls') {
          const partial = parts[1] || '';
          const options = Object.keys(dir.contents).filter(name => name.startsWith(partial));
          if (options.length === 1) {
            inputElement.value = cmd.slice(0, cmd.lastIndexOf(' ') + 1) + options[0];
          } else if (options.length > 1) {
            handleOutput(cmd, `Did you mean? ${options.join('  ')}`);
          }
        }
      }
    });

    renderTerminal();
  </script>
</body>
</html>
