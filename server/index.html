<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Info</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; color: #333; }
    h1 { text-align: center; }
    .info { margin-bottom: 15px; }
    .info label { font-weight: bold; }
    pre { background: #222; color: #0f0; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Network Information</h1>

  <div class="info"><label>Local IP:</label> <span id="local-ip">Detecting...</span></div>
  <div class="info"><label>Public IP:</label> <span id="public-ip">Detecting...</span></div>
  <div class="info"><label>User Agent:</label> <pre id="user-agent"></pre></div>

  <script>
    // Get Local IP using WebRTC
    function getLocalIP(callback) {
      const rtc = new RTCPeerConnection({iceServers: []});
      rtc.createDataChannel('');
      rtc.createOffer().then(offer => rtc.setLocalDescription(offer)).catch(err => console.error(err));
      
      rtc.onicecandidate = event => {
        if (event && event.candidate && event.candidate.candidate) {
          const candidate = event.candidate.candidate;
          const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
          const match = candidate.match(ipRegex);
          if (match) {
            callback(match[1]);
            rtc.onicecandidate = null;
          }
        }
      };
    }

    // Get Public IP from API
    function getPublicIP() {
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => {
          document.getElementById('public-ip').textContent = data.ip;
        })
        .catch(() => {
          document.getElementById('public-ip').textContent = 'Failed to fetch';
        });
    }

    // Init
    getLocalIP(ip => document.getElementById('local-ip').textContent = ip);
    getPublicIP();
    document.getElementById('user-agent').textContent = navigator.userAgent;
  </script>
</body>
</html>
