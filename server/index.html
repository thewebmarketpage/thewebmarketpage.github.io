<!DOCTYPE html>
<html>
<head>
  <title>Browser Terminal</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: monospace;
      background: #111;
      color: #0f0;
    }

    #terminal {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
      overflow-y: auto;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .input-line {
      display: flex;
      margin-top: auto;
    }

    .input-line span {
      color: #0ff;
      margin-right: 5px;
    }

    .input-line input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #0f0;
      font-family: monospace;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="line">Welcome to the browser terminal. Type <code>help</code> to get started.</div>
    <div class="input-line">
      <span>$</span><input type="text" id="input" autofocus />
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('input');

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const cmd = input.value;
        const output = handleCommand(cmd);
        const inputLine = document.createElement('div');
        inputLine.className = 'line';
        inputLine.innerHTML = `<span style="color:#0ff;">$</span> ${cmd}`;
        terminal.insertBefore(inputLine, input.parentElement);

        if (output !== '') {
          const out = document.createElement('div');
          out.className = 'line';
          out.innerHTML = output;
          terminal.insertBefore(out, input.parentElement);
        }

        input.value = '';
        terminal.scrollTop = terminal.scrollHeight;
      }
    });

    function handleCommand(cmd) {
      // TEMP stub while we build all features
      if (cmd === 'help') {
        return `Available commands:<br>help, clear, echo, ls, cd, mkdir, touch, cat, tree, rm, nano`;
      } else if (cmd.startsWith('echo ')) {
        return cmd.slice(5);
      } else if (cmd === 'clear') {
        const container = input.parentElement;
        terminal.innerHTML = '';
        terminal.appendChild(container);
        return '';
      } else {
        return `Command not found: ${cmd}`;
      }
    }
  </script>
</body>
</html>
