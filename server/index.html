<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .info {
            margin-bottom: 15px;
        }
        .info label {
            font-weight: bold;
        }
        pre {
            background-color: #282828;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>System Information (Browser-Side)</h1>
    <div class="info">
        <label>Public IP:</label>
        <span id="public-ip">Loading...</span>
    </div>
    <div class="info">
        <label>Browser Name:</label>
        <span id="browser-name">Loading...</span>
    </div>
    <div class="info">
        <label>Browser Version:</label>
        <span id="browser-version">Loading...</span>
    </div>
    <div class="info">
        <label>Operating System:</label>
        <span id="os">Loading...</span>
    </div>
    <div class="info">
        <label>Screen Resolution:</label>
        <span id="resolution">Loading...</span>
    </div>
    <div class="info">
        <label>User Agent:</label>
        <span id="user-agent">Loading...</span>
    </div>

    <script>
        // Fetch Public IP from an external service
        function fetchPublicIP() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('public-ip').textContent = data.ip;
                })
                .catch(error => {
                    document.getElementById('public-ip').textContent = 'Failed to fetch public IP';
                });
        }

        // Function to get browser and OS information
        function getBrowserInfo() {
            const userAgent = navigator.userAgent;
            const browserName = navigator.appName;
            const browserVersion = navigator.appVersion;
            const os = navigator.platform;

            document.getElementById('browser-name').textContent = browserName;
            document.getElementById('browser-version').textContent = browserVersion;
            document.getElementById('os').textContent = os;
            document.getElementById('user-agent').textContent = userAgent;
        }

        // Function to get screen resolution
        function getScreenResolution() {
            const width = window.screen.width;
            const height = window.screen.height;
            document.getElementById('resolution').textContent = `${width} x ${height}`;
        }

        // Run when the page loads
        window.onload = function() {
            fetchPublicIP();
            getBrowserInfo();
            getScreenResolution();
        };
    </script>
</body>
</html>
