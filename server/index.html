<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .info {
            margin-bottom: 15px;
        }
        .info label {
            font-weight: bold;
        }
        pre {
            background-color: #282828;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>System Information</h1>
    <div class="info">
        <label>Local IP:</label>
        <span id="local-ip">Not available via JS</span>
    </div>
    <div class="info">
        <label>Public IP:</label>
        <span id="public-ip">Loading...</span>
    </div>
    <div class="info">
        <label>Hostname:</label>
        <span id="hostname">Not available via JS</span>
    </div>

    <div class="info">
        <label>System Information:</label>
        <pre id="system-info">Not available via JS</pre>
    </div>

    <div class="info">
        <label>Running Services:</label>
        <pre id="services">Not available via JS</pre>
    </div>

    <div class="info">
        <label>Open Ports:</label>
        <pre id="open-ports">Not available via JS</pre>
    </div>

    <script>
        // Fetch Public IP from an external service
        function fetchPublicIP() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('public-ip').textContent = data.ip;
                })
                .catch(error => {
                    document.getElementById('public-ip').textContent = 'Failed to fetch public IP';
                });
        }

        // Run when the page loads
        window.onload = function() {
            fetchPublicIP();
        };
    </script>
</body>
</html>
