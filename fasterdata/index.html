<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FasterData - Domain Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="562436860775-mt3jpblj0iscaletgi8osacofke0cm7j.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #domainResult {
      margin-top: 20px;
      font-weight: bold;
    }

    .g_id_signin {
      margin: 20px auto;
      display: inline-block;
    }

    .divider {
      margin: 40px 0;
      border-top: 1px solid #ccc;
    }

    .console-output {
      margin-top: 20px;
      padding: 20px;
      background-color: black;
      color: #00FF00;
      font-family: monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 300px;
      overflow-y: scroll;
    }

    #domainInput {
      width: 300px;
    }

    .register-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    .register-button:hover {
      background-color: #45a049;
    }

    .unavailable {
      color: red;
    }

    .available {
      color: green;
    }
  </style>
</head>
<body>

  <h1>Welcome to FasterData</h1>
  <p>Domain Registration Made Easy</p>

  <!-- Google Login -->
  <div id="g_id_onload"
       data-client_id="562436860775-mt3jpblj0iscaletgi8osacofke0cm7j.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div class="divider"></div>

  <!-- Domain Search -->
  <h2>Search for Multiple Domains</h2>
  <input type="text" id="domainInput" placeholder="example.com,domain2.com,domain3.net">
  <button onclick="searchDomains()">Search</button>
  <p id="domainResult"></p>

  <!-- Console Output -->
  <div class="console-output" id="consoleOutput"></div>

  <script>
    const apiKey = "6f946d8551777d22ac47";
    const proxyUrl = "https://api.codetabs.com/v1/proxy/?quest=";

    function searchDomains() {
      const domainsInput = document.getElementById("domainInput").value.trim();
      const result = document.getElementById("domainResult");
      const consoleOutput = document.getElementById("consoleOutput");

      if (!domainsInput) {
        result.textContent = "❗ Please enter at least one domain.";
        logToConsole("❗ Please enter at least one domain.");
        return;
      }

      const domains = domainsInput.split(',').map(domain => domain.trim()).join(',');
      result.textContent = "🔍 Checking availability...";
      logToConsole(`🔍 Checking availability for ${domains}...`);

      const apiUrl = `https://www.namesilo.com/api/checkRegisterAvailability?version=1&type=json&key=${apiKey}&domains=${encodeURIComponent(domains)}`;
      const finalUrl = proxyUrl + encodeURIComponent(apiUrl);

      fetch(finalUrl)
        .then(response => response.json())
        .then(data => {
          // Print the full response to the console (like a real terminal log)
          logToConsole(`Full API Response: ${JSON.stringify(data, null, 2)}`);

          if (data.reply && data.reply.code === "300") {
            const availableDomains = data.reply.available || [];
            const unavailableDomains = data.reply.unavailable || [];

            // Clear previous results
            result.innerHTML = "";

            // Handle available domains
            availableDomains.forEach(item => {
              const domain = item.domain;
              const price = item.price;
              result.innerHTML += `
                <div class="available">
                  ✅ ${domain} is available for $${price}. 
                  <button class="register-button" onclick="registerDomain('${domain}')">Register</button>
                </div>
              `;
              logToConsole(`✅ ${domain} is available for $${price}`);
            });

            // Handle unavailable domains
            unavailableDomains.forEach(domain => {
              result.innerHTML += `
                <div class="unavailable">
                  ❌ ${domain} is taken.
                </div>
              `;
              logToConsole(`❌ ${domain} is taken.`);
            });

            // If no domains are found, show a message to try again
            if (availableDomains.length === 0 && unavailableDomains.length === 0) {
              result.innerHTML = "<div class='unavailable'>⚠️ No valid domain information found. Please try again.</div>";
              logToConsole("⚠️ No valid domain information found. Please try again.");
            }
          } else {
            result.innerHTML = "<div class='unavailable'>⚠️ Error processing the domain information. Please try again.</div>";
            logToConsole("⚠️ Error processing the domain information.");
          }
        })
        .catch(error => {
          console.error("Error:", error);
          result.innerHTML = "<div class='unavailable'>⚠️ Error checking domains. Please try again later.</div>";
          logToConsole(`⚠️ Error: ${error}`);
        });
    }

    function registerDomain(domain) {
      alert(`Registering domain: ${domain}`);
      // Implement registration logic here (e.g., redirect to a registration page or trigger an API call to register the domain)
      logToConsole(`Initiating registration for domain: ${domain}`);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      localStorage.setItem("user", JSON.stringify(data));
      window.location.href = "https://giantwebmarket.com/fasterdata/dash.html";
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    function logToConsole(message) {
      const consoleOutput = document.getElementById("consoleOutput");
      consoleOutput.textContent += message + '\n';  // Append the new message to the console output
      consoleOutput.scrollTop = consoleOutput.scrollHeight;  // Scroll to the bottom of the console box
    }
  </script>

</body>
</html>
