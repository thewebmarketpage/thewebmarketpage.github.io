<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FasterData - Domain Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #domainResult {
      margin-top: 20px;
      font-weight: bold;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .domain-result-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .unavailable {
      color: red;
    }
    .available {
      color: green;
    }
    .register-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      margin-left: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    #domainInput {
      width: 300px;
    }
  </style>
</head>
<body>

  <h1>Welcome to FasterData</h1>
  <p>Domain Registration Made Easy</p>

  <h2>Search for Domains</h2>
  <input type="text" id="domainInput" placeholder="example.com, domain2.com">
  <button onclick="searchDomains()">Search</button>
  <div id="domainResult"></div>

  <script>
    const apiKey = "6f946d8551777d22ac47";
    const proxyUrl = "https://api.codetabs.com/v1/proxy/?quest=";

    function searchDomains() {
      const domainsInput = document.getElementById("domainInput").value.trim();
      const result = document.getElementById("domainResult");

      if (!domainsInput) {
        result.innerHTML = "<div class='unavailable'>❗ Please enter at least one domain.</div>";
        return;
      }

      const domains = domainsInput.split(',').map(domain => domain.trim()).filter(domain => domain.length > 0);
      result.innerHTML = "<div>🔍 Checking availability...</div>";

      const apiUrl = `https://www.namesilo.com/api/checkRegisterAvailability?version=1&type=json&key=${apiKey}&domains=${encodeURIComponent(domains.join(','))}`;
      const finalUrl = proxyUrl + encodeURIComponent(apiUrl);

      fetch(finalUrl)
        .then(response => response.json())
        .then(data => {
          let html = '';
          
          // Process available domains
          if (data.reply.available) {
            if (data.reply.available.domain) {
              // Single domain response
              const domain = data.reply.available.domain;
              html += `
                <div class="domain-result-item available">
                  ✅ ${domain.domain} is available ($${domain.price})
                  <button class="register-button" onclick="registerDomain('${domain.domain}')">Register</button>
                </div>
              `;
            } else if (Array.isArray(data.reply.available)) {
              // Multiple domains response
              data.reply.available.forEach(domain => {
                html += `
                  <div class="domain-result-item available">
                    ✅ ${domain.domain} is available ($${domain.price})
                    <button class="register-button" onclick="registerDomain('${domain.domain}')">Register</button>
                  </div>
                `;
              });
            }
          }

          // Process unavailable domains
          if (data.reply.unavailable) {
            if (Array.isArray(data.reply.unavailable)) {
              data.reply.unavailable.forEach(domain => {
                html += `<div class="domain-result-item unavailable">❌ ${domain} is not available</div>`;
              });
            } else if (typeof data.reply.unavailable === "string") {
              html += `<div class="domain-result-item unavailable">❌ ${data.reply.unavailable} is not available</div>`;
            }
          }

          result.innerHTML = html || "<div class='unavailable'>unavailable domain name, you can try another one!</div>";
        })
        .catch(error => {
          result.innerHTML = "<div class='unavailable'>Error checking domains. Please try again.</div>";
          console.error("Error:", error);
        });
    }

    function registerDomain(domain) {
      alert(`Would register domain: ${domain}`);
      // In a real app, you would redirect to registration page or make API call
    }
  </script>

</body>
</html>
