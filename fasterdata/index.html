<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FasterData - Domain Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="562436860775-mt3jpblj0iscaletgi8osacofke0cm7j.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      padding: 40px;
      margin: 0;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #333;
    }

    p {
      font-size: 18px;
      color: #666;
    }

    input, button {
      padding: 12px;
      font-size: 16px;
      margin: 10px 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 250px;
      max-width: 90%;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    button:hover {
      background-color: #0056b3;
    }

    #domainResult {
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #444;
    }

    .g_id_signin {
      margin: 20px auto;
      display: inline-block;
    }

    .divider {
      margin: 40px auto;
      width: 80%;
      max-width: 400px;
      border-top: 1px solid #ccc;
    }

    @media (max-width: 500px) {
      input, button {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>Welcome to FasterData</h1>
  <p>Domain Registration Made Easy</p>

  <!-- Google Sign-In Button -->
  <div id="g_id_onload"
       data-client_id="562436860775-mt3jpblj0iscaletgi8osacofke0cm7j.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div class="divider"></div>

  <!-- Domain Search -->
  <h2>Search for a Domain</h2>
  <input type="text" id="domainInput" placeholder="Enter a domain (e.g. example.com)">
  <button onclick="searchDomain()">Check Availability</button>
  <p id="domainResult"></p>

 <script>
  const apiKey = "6f946d8551777d22ac47";
  const proxies = [
    "https://corsproxy.io/?",
    "https://api.allorigins.win/raw?url=",
    "https://thingproxy.freeboard.io/fetch/",
    "https://cors-anywhere.herokuapp.com/",
    "https://yacdn.org/proxy/"
  ];

  async function searchDomain() {
    const domain = document.getElementById("domainInput").value.trim();
    const result = document.getElementById("domainResult");

    if (!domain) {
      result.textContent = "❗ Please enter a domain name.";
      return;
    }

    result.textContent = "🔍 Checking availability...";

    const realUrl = `https://www.namesilo.com/api/checkRegisterAvailability?version=1&type=json&key=${apiKey}&domain=${encodeURIComponent(domain)}`;

    for (let i = 0; i < proxies.length; i++) {
      const proxy = proxies[i];
      const fullUrl = proxy + encodeURIComponent(realUrl);

      try {
        const response = await fetch(fullUrl);
        const contentType = response.headers.get("content-type");

        if (!response.ok || !contentType || !contentType.includes("application/json")) {
          throw new Error("Invalid response type or status");
        }

        const data = await response.json();

        if (data.reply && data.reply.available === "yes") {
          result.textContent = `✅ ${domain} is available! (Proxy: "${proxy}")`;
        } else {
          result.textContent = `❌ ${domain} is taken. (Proxy: "${proxy}")`;
        }

        console.log("✔ Used proxy:", proxy);
        return;
      } catch (error) {
        console.warn(`❌ Proxy failed: ${proxy}`, error);
      }
    }

    result.textContent = "⚠️ All proxies failed. Try again later.";
  }

  function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);
    if (data) {
      localStorage.setItem("user", JSON.stringify(data));
      window.location.href = "https://giantwebmarket.com/fasterdata/dash.html";
    } else {
      alert("Login failed.");
    }
  }

  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    } catch (e) {
      console.error("Failed to parse JWT", e);
      return null;
    }
  }
</script>


</body>
</html>
