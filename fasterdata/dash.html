<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0d1117;
      color: #fff;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #58a6ff;
    }

    .welcome {
      font-size: 24px;
      margin-top: 40px;
    }

    .btn {
      background-color: #da3633;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #e5534b;
    }
  </style>
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>
  <p class="welcome" id="welcomeMessage">Checking login status...</p>
  <button class="btn" onclick="logout()">Logout</button>

  <script>
    const userName = localStorage.getItem("user_name");

    if (!userName) {
      // Not logged in, redirect to index.html
      window.location.href = "https://giantwebmarket.com/fasterdata/index.html";
    } else {
      document.getElementById("welcomeMessage").textContent = `Hello, ${userName}!`;
    }

    function logout() {
      localStorage.removeItem("user_name");
      window.location.href = "https://giantwebmarket.com/fasterdata/index.html";
    }
  </script>
</body>
</html>
