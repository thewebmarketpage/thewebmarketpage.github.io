    <script>
      // Function to repair invalid JSON
      function repairJSON() {
        const input = document.getElementById('json-input').value;
        try {
          // Try parsing the invalid JSON using json-parse-even-better-errors
          const parsedJson = JSON.parse(input);
          const repairedJson = JSON.stringify(parsedJson, null, 2);
          document.getElementById('json-input').value = repairedJson;
        } catch (e) {
          // If the JSON is invalid, try to repair it using json-stringify-pretty-compact
          try {
            const repairedJson = JSON.stringifyPrettyCompact(input);
            document.getElementById('json-input').value = repairedJson;
          } catch (e) {
            alert('Failed to repair JSON: ' + e.message);
          }
        }
      }

      // Function to copy the repaired JSON to clipboard
      function copyToClipboard() {
        const output = document.getElementById('json-input');
        output.select();
        document.execCommand('copy');
      }
    </script>
