    <meta name="description" content="PDF to Text Converter is a fast and free cloud tool to convert PDF files to plain text online. Quickly extract text from PDFs without the need for any software installation.">

    <meta name="google-adsense-account" content="ca-pub-4307722391842007">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <style>

        font-size: 22px;
        color: white;
      }

      /* Make logo text much bigger */

      /* Footer text a little bigger */

    <!-- PDF.js CDN -->
    <script src="https://giantwebmarket.com/js/pdf.min.js"></script>
    <script>
      function triggerFileUpload() {
        document.getElementById('file-upload-input').click();
      }

      function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file && file.type === 'application/pdf') {
          const reader = new FileReader();
          reader.onload = function(e) {
            const arrayBuffer = e.target.result;
            extractTextFromPDF(arrayBuffer);
          };
          reader.readAsArrayBuffer(file);
        } else {
          alert('Please upload a valid PDF file.');
        }
      }

      function extractTextFromPDF(arrayBuffer) {
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        loadingTask.promise.then(function(pdf) {
          let textContent = '';
          const numPages = pdf.numPages;
          let pagePromises = [];
          for (let i = 1; i <= numPages; i++) {
            pagePromises.push(pdf.getPage(i).then(function(page) {
              return page.getTextContent().then(function(text) {
                text.items.forEach(function(item) {
                  textContent += item.str + '\n';
                });
              });
            }));
          }
          Promise.all(pagePromises).then(function() {
            window.pdfTextContent = textContent;
            displayTextInBox(window.pdfTextContent);
            alert('PDF loaded successfully. You can now download the extracted text.');
          });
        }, function(error) {
          alert('Error extracting text from PDF: ' + error.message);
        });
      }

      function displayTextInBox(text) {
        const box = document.querySelector('.preview-uploaded-pdf-file-as-image-box');
        box.textContent = text;
        box.style.overflowY = 'auto';
        box.style.padding = '10px';
      }

      function downloadTextFile() {
        if (window.pdfTextContent) {
          const blob = new Blob([window.pdfTextContent], { type: 'text/plain' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'extracted_text.txt';
          link.click();
        } else {
          alert('No text available to download. Please upload a PDF first.');
        }
      }
    </script>
