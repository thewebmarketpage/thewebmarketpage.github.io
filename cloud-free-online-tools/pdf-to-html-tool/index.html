    <input type="file" id="file-upload-input" style="display: none;" accept="application/pdf" onchange="handleFile(event)">

    <script>
      let renderedHTML = '';

      function triggerFileUpload() {
        document.getElementById('file-upload-input').click();
      }

      async function handleFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileReader = new FileReader();
        fileReader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          renderPDF(typedarray);
        };
        fileReader.readAsArrayBuffer(file);
      }

      async function renderPDF(pdfData) {
        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        const pdf = await loadingTask.promise;
        let combinedHTML = '';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          const imgData = canvas.toDataURL();

          const imgHTML = `<img src="${imgData}" style="width:100%; margin-bottom: 10px;">\n`;
          combinedHTML += imgHTML;
        }

        renderedHTML = `<html><body style="background:black;">${combinedHTML}</body></html>`;
        document.getElementById('preview-box').innerText = renderedHTML;
      }

      function downloadHTML() {
        if (!renderedHTML) {
          alert("Please upload a PDF first!");
          return;
        }
        const blob = new Blob([renderedHTML], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'converted.html';
        link.click();
      }
    </script>
