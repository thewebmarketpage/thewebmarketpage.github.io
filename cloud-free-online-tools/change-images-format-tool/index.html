  <script>
    let uploadedImage = null;

    // Function to trigger the file upload
    function triggerFileUpload() {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = function(event) {
            let file = event.target.files[0];
            if (file) {
                uploadedImage = file;
                displayImagePreview(file);
            }
        };
        input.click();
    }

    // Display the image preview after upload
    function displayImagePreview(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const previewBox = document.querySelector('.preview-uploaded-image-box');
            previewBox.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 100%;">`;
        };
        reader.readAsDataURL(file);
    }

    // Function to handle image conversion and download
    function downloadConvertedImage() {
        let selectedFormat = document.querySelector('input[name="format"]:checked');
        if (!selectedFormat) {
            alert("Please select a format first.");
            return;
        }

        if (!uploadedImage) {
            alert("Please upload an image first.");
            return;
        }

        let fileFormat = selectedFormat.value;

        // Use FileReader to convert image to selected format
        const reader = new FileReader();
        reader.onload = function(e) {
            let imgData = e.target.result;
            let convertedImageUrl = '';

            if (fileFormat === "jpg" || fileFormat === "png" || fileFormat === "gif" || fileFormat === "bmp") {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                let img = new Image();

                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Convert the image to the selected format
                    convertedImageUrl = canvas.toDataURL('image/' + fileFormat);
                    downloadImage(convertedImageUrl, fileFormat);
                };

                img.src = imgData;
            } else if (fileFormat === "webp") {
                // WebP conversion using canvas (native support in browsers)
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                let img = new Image();

                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Convert to WebP format using canvas
                    convertedImageUrl = canvas.toDataURL('image/webp');
                    downloadImage(convertedImageUrl, fileFormat);
                };

                img.src = imgData;
            } else if (fileFormat === "ico") {
                // ICO conversion (basic approach)
                alert("ICO format is a complex format and requires specialized libraries or handling.");
            } else if (fileFormat === "tiff") {
                // TIFF conversion using TIFF.js
                const tiffReader = new FileReader();
                tiffReader.onload = function(e) {
                    let arrayBuffer = e.target.result;
                    let tiff = new Tiff({ buffer: arrayBuffer });
                    let canvas = tiff.toCanvas();
                    convertedImageUrl = canvas.toDataURL("image/png");  
                    downloadImage(convertedImageUrl, 'png');  
                };
                tiffReader.readAsArrayBuffer(uploadedImage);
            }
        };
        reader.readAsDataURL(uploadedImage);
    }

    // Function to handle the image download
    function downloadImage(url, format) {
        const link = document.createElement("a");
        link.href = url;
        link.download = `converted_image.${format}`;
        link.click();
    }
  </script>
