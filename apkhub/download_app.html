<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Listing</title>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Icons" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .app-details { max-width: 600px; margin: auto; }
        .screenshot { width: 100px; height: auto; margin: 5px; }
        .similar-apps { display: flex; overflow-x: auto; }
        .similar-app-icon { width: 50px; height: 50px; margin: 5px; }
    </style>
</head>
<body>
    <div class="app-details">
        <h2 id="app-title"></h2>
        <img id="app-icon" width="100" height="100">
        <p id="app-description"></p>
        <div id="screenshots"></div>
        <h3>Similar Apps</h3>
        <div class="similar-apps" id="similar-apps-list"></div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get("id");
            if (!appId) return;
            
            let jsonData = sessionStorage.getItem("apkData");
            if (!jsonData) {
                try {
                    const response = await fetch("https://giantwebmarket.com/apkhub/apkhubdata.json");
                    jsonData = await response.json();
                    sessionStorage.setItem("apkData", JSON.stringify(jsonData));
                } catch (error) {
                    console.error("Failed to fetch app data", error);
                    return;
                }
            } else {
                jsonData = JSON.parse(jsonData);
            }
            
            const app = jsonData.find(app => app.id === appId);
            if (!app) return;
            
            document.getElementById("app-title").textContent = app.title;
            document.getElementById("app-icon").src = app.icon;
            document.getElementById("app-description").textContent = app.description;
            
            const screenshotsContainer = document.getElementById("screenshots");
            const fragment = document.createDocumentFragment();
            app.screenshots.forEach(src => {
                const img = document.createElement("img");
                img.src = src;
                img.className = "screenshot";
                img.loading = "lazy";
                fragment.appendChild(img);
            });
            screenshotsContainer.appendChild(fragment);
            
            renderSimilarApps(app, jsonData);
        });
        
        function renderSimilarApps(currentApp, allApps) {
            const similarAppsList = document.getElementById("similar-apps-list");
            similarAppsList.innerHTML = "";
            const keywords = currentApp.title.toLowerCase().split(" ");
            
            const similarApps = allApps.filter(app => 
                app.id !== currentApp.id && keywords.some(word => app.title.toLowerCase().includes(word))
            ).slice(0, 5);
            
            const fragment = document.createDocumentFragment();
            similarApps.forEach(app => {
                const img = document.createElement("img");
                img.src = app.icon;
                img.className = "similar-app-icon";
                img.loading = "lazy";
                img.onclick = () => window.location.href = `?id=${app.id}`;
                fragment.appendChild(img);
            });
            
            similarAppsList.appendChild(fragment);
        }
    </script>
</body>
</html>
