<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading App...</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .hidden { display: none; }
        .error-message { color: red; }
        #loading { text-align: center; font-size: 18px; }
        .app-container { display: none; }
        .download-btn { display: inline-block; padding: 10px 20px; background: blue; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <div class="app-container">
        <h1 id="app-title">App Name</h1>
        <p><strong>Version:</strong> <span id="app-version"></span></p>
        <p><strong>Author:</strong> <span id="app-author"></span></p>
        <p id="app-article"></p>
        <a id="download-btn" class="download-btn" href="#">Download</a>
    </div>

    <script>
        async function fetchAppData() {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get("id");
            if (!appId) {
                document.getElementById("loading").innerHTML = "<div class='error-message'>App not found.</div>";
                return;
            }

            // Check cache first
            const cachedData = localStorage.getItem(`app_${appId}`);
            if (cachedData) {
                displayAppDetails(JSON.parse(cachedData));
                return;
            }

            try {
                const response = await fetch("https://giantwebmarket.com/apkhub/apkhubdata.json");
                const apps = await response.json();
                const app = apps.find(a => a.id === appId);
                if (!app) throw new Error("App not found");

                localStorage.setItem(`app_${appId}`, JSON.stringify(app));
                displayAppDetails(app);
            } catch (error) {
                console.error("Error loading app:", error);
                document.getElementById("loading").innerHTML = "<div class='error-message'>Failed to load app details.</div>";
            }
        }

        function displayAppDetails(app) {
            document.getElementById("app-title").textContent = app.title || "Unknown";
            document.getElementById("app-version").textContent = app.version || "Unknown";
            document.getElementById("app-author").textContent = app.author || "Unknown";
            document.getElementById("app-article").textContent = app.article || "No details available";
            document.title = app.title || "App";

            if (app.download_url) {
                const downloadBtn = document.getElementById("download-btn");
                downloadBtn.href = app.download_url;
                downloadBtn.onclick = (e) => handleDownload(e, app.download_url);
            }

            document.getElementById("loading").style.display = "none";
            document.querySelector(".app-container").style.display = "block";
        }

        function handleDownload(event, url) {
            event.preventDefault();
            if (!url) {
                alert("Download link unavailable");
                return;
            }
            window.location.href = url;
        }

        document.addEventListener("DOMContentLoaded", fetchAppData);
    </script>
</body>
</html>
