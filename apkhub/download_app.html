<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        img {
            width: 100px;
            height: auto;
            display: block;
            margin-bottom: 10px;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1 id="app-title">Loading...</h1>
    <img id="app-icon" src="default-icon.png" alt="App Icon"> 
    <p><strong>Version:</strong> <span id="app-version">Loading...</span></p>
    <p><strong>Author:</strong> <span id="app-author">Loading...</span></p>
    <p><strong>About:</strong> <span id="app-header">Loading...</span></p>
    <p id="app-article">Loading...</p>

    <a id="download-btn" class="download-btn" href="#" target="_blank">Download App</a>

    <script>
        const jsonUrl = "apkhubdata.json"; 

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function fetchAppData() {
            try {
                console.log("📡 Fetching JSON data...");
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error("Failed to load JSON.");
                const apps = await response.json();
                
                console.log("✅ JSON data loaded:", apps);

                const appId = getQueryParam("id");
                if (!appId) {
                    document.body.innerHTML = "<h2>Error: No app ID provided.</h2>";
                    return;
                }

                console.log(`🔍 Searching for app with ID: ${appId}`);

                const app = apps.find(a => a.id.toString() === appId.toString());
                if (!app) {
                    document.body.innerHTML = `<h2>Error: App with ID ${appId} not found.</h2>`;
                    console.error("❌ App ID not found in JSON:", appId);
                    return;
                }

                console.log("🎯 App found:", app);

                document.title = app.title;
                document.getElementById("app-title").textContent = app.title;
                document.getElementById("app-icon").src = app.app_icon || "default-icon.png";
                document.getElementById("app-version").textContent = app.version;
                document.getElementById("app-author").textContent = app.author;
                document.getElementById("app-header").textContent = app.header;
                document.getElementById("app-article").textContent = app.article;
                document.getElementById("download-btn").href = app.download_url;

            } catch (error) {
                console.error("❌ Error loading app data:", error);
                document.body.innerHTML = "<h2>Error loading app. Please try again later.</h2>";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchAppData);
    </script>

</body>
</html>
