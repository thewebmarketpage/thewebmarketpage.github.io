<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        img {
            width: 100px;
            height: auto;
            display: block;
            margin-top: 10px;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1 id="app-title">Loading...</h1>
    
    <p><strong>Version:</strong> <span id="app-version">Loading...</span></p>
    <p><strong>Author:</strong> <span id="app-author">Loading...</span></p>
    <p><strong>About:</strong> <span id="app-header">Loading...</span></p>
    <p id="app-article">Loading...</p>
    <img id="app-image" src="" alt="App Image" style="display:none;">
    
    <a id="download-btn" class="download-btn" href="#" target="_blank">Download App</a>

    <div id="loading">Loading apps...</div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('apkhubdata.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error loading apps:', error);
                document.getElementById('loading').innerHTML = 'Error loading apps. Please try again later.';
                return [];
            }
        }

        function assignUniqueIds(data) {
            return data.map((app, index) => {
                app.id = `app-${index + 1}`;
                return app;
            });
        }

        async function fetchAppImage(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const imgElement = doc.querySelector('#main > div.container > div > div.column.is-main > div.app_header.mt-14 > div.avatar > img');
                return imgElement ? imgElement.src : null;
            } catch (error) {
                console.error('Error fetching app image:', error);
                return null;
            }
        }

        async function displayAppDetails(app) {
            document.getElementById('app-title').textContent = app.title || 'No title available';
            document.getElementById('app-version').textContent = app.version || 'No version available';
            document.getElementById('app-author').textContent = app.author || 'No author available';
            document.getElementById('app-header').textContent = app.header || 'No description available';
            document.getElementById('app-article').textContent = app.article || 'No article available';
            document.getElementById('download-btn').href = app.download_url || '#';
            document.getElementById('loading').style.display = 'none';
            document.title = app.title || 'App Details';

            if (app.url) {
                const imageUrl = await fetchAppImage(app.url);
                if (imageUrl) {
                    const imgElement = document.getElementById('app-image');
                    imgElement.src = imageUrl;
                    imgElement.style.display = 'block';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const appId = new URLSearchParams(window.location.search).get('id');
            if (appId) {
                const allApps = await fetchData();
                const appsWithIds = assignUniqueIds(allApps);
                const app = appsWithIds.find(a => a.id === appId);
                if (app) {
                    displayAppDetails(app);
                } else {
                    document.getElementById('loading').innerHTML = 'App not found.';
                }
            } else {
                document.getElementById('loading').innerHTML = 'No app ID provided.';
            }
        });
    </script>
</body>
</html>
