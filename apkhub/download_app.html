<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Image Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        img {
            width: 100px;
            height: auto;
            display: block;
        }
        #app-image-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>App Details</h1>
    <div id="app-image-container"></div>

    <script>
        async function fetchImageFromApp(appUrl) {
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url='; // CORS proxy URL
                const imageUrl = `${proxyUrl}${encodeURIComponent(appUrl)}`; // Append the target URL

                const response = await fetch(imageUrl);
                const text = await response.text();

                // Find the image URL (it should start with 'https://play-lh.googleusercontent.com/')
                const imageRegex = /https:\/\/play-lh\.googleusercontent\.com\/.*?\.jpg/;
                const match = text.match(imageRegex);

                if (match && match[0]) {
                    const imageElement = document.createElement('img');
                    imageElement.src = match[0];  // Use the matched image URL
                    imageElement.alt = 'App Image';
                    imageElement.style.width = '100px'; // Set your desired size
                    document.getElementById('app-image-container').appendChild(imageElement);
                } else {
                    console.error('No image found.');
                }
            } catch (error) {
                console.error('Error fetching image:', error);
            }
        }

        async function fetchData() {
            try {
                const response = await fetch('https://giantwebmarket.com/apkhub/apkhubdata.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error loading apps:', error);
                return [];
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const appId = new URLSearchParams(window.location.search).get('id'); // Get the app ID from URL
            if (appId) {
                const allApps = await fetchData();
                const app = allApps.find(a => a.id === appId); // Find the app by its unique ID

                if (app && app.url) {
                    // Send the app URL to fetch the image
                    fetchImageFromApp(app.url);
                } else {
                    console.error('App not found or URL missing.');
                }
            } else {
                console.error('No app ID provided.');
            }
        });
    </script>
</body>
</html>
