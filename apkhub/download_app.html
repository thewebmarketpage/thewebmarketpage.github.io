<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title> <!-- Title will update in real-time -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        img {
            width: 100px;
            height: auto;
            display: block;
            margin-bottom: 10px;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1 id="app-title">Loading...</h1>
    <img id="app-icon" src="default-icon.png" alt="App Icon"> <!-- Default icon -->
    <p><strong>Version:</strong> <span id="app-version">Loading...</span></p>
    <p><strong>Author:</strong> <span id="app-author">Loading...</span></p>
    <p><strong>About:</strong> <span id="app-header">Loading...</span></p>
    <p id="app-article">Loading...</p>

    <a id="download-btn" class="download-btn" href="#" target="_blank">Download App</a>

    <script>
        const jsonUrl = "apkhubdata.json"; // JSON file URL

        // Function to get query parameters from URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function fetchAppData() {
            try {
                const response = await fetch(jsonUrl);
                const apps = await response.json();
                
                const appId = getQueryParam("id");
                if (!appId) {
                    document.body.innerHTML = "<h2>Error: No app ID provided.</h2>";
                    return;
                }

                // Find the app data by ID
                const app = apps.find(a => a.id === appId);
                if (!app) {
                    document.body.innerHTML = "<h2>Error: App not found.</h2>";
                    return;
                }

                // Update page title & content
                document.title = app.title;
                document.getElementById("app-title").textContent = app.title;
                document.getElementById("app-icon").src = app.app_icon; // Default from JSON
                document.getElementById("app-version").textContent = app.version;
                document.getElementById("app-author").textContent = app.author;
                document.getElementById("app-header").textContent = app.header;
                document.getElementById("app-article").textContent = app.article;
                document.getElementById("download-btn").href = app.download_url;

                // Fetch the real app icon
                fetchAppIcon(app.url);
            } catch (error) {
                console.error("❌ Error loading app data:", error);
                document.body.innerHTML = "<h2>Error loading app. Please try again later.</h2>";
            }
        }

        async function fetchAppIcon(url) {
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                // Parse the HTML content
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');

                // Try to find the image inside the app's page
                const imgElement = doc.querySelector("#main .container .column.is-main .app_header .avatar img");

                if (imgElement) {
                    let imgUrl = imgElement.getAttribute('src') || imgElement.getAttribute('data-src');

                    if (imgUrl) {
                        // Replace default app icon with the new image
                        document.getElementById('app-icon').src = imgUrl;
                        console.log("✅ Found and updated app icon:", imgUrl);
                    } else {
                        console.warn("⚠ Image URL not found in data-src.");
                    }
                } else {
                    console.warn("⚠ No matching image element found.");
                }
            } catch (error) {
                console.error('❌ Error fetching app icon:', error);
            }
        }

        // Load the app data when the page is ready
        document.addEventListener("DOMContentLoaded", fetchAppData);
    </script>

</body>
</html>
