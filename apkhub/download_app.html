<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        img {
            width: 100px;
            height: auto;
            display: block;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>{{ app.title }}</h1>
    <img id="app-icon" src="{{ app.app_icon }}" alt="App Icon">
    <p><strong>Version:</strong> {{ app.version }}</p>
    <p><strong>Author:</strong> {{ app.author }}</p>
    <p><strong>About:</strong> {{ app.header }}</p>
    <p>{{ app.article }}</p>

    <a class="download-btn" href="{{ app.download_url }}" target="_blank">Download App</a>

    <script>
        // Function to fetch app icon
        async function fetchAppIcon(url) {
            try {
                // Create an iframe to load the external URL
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';  // Hide the iframe
                document.body.appendChild(iframe);

                // Listen for iframe load event
                iframe.onload = function() {
                    let iframeDoc = iframe.contentWindow.document;

                    // Find the avatar image in the iframe's document
                    let imgElement = iframeDoc.querySelector('.avatar img');
                    if (imgElement) {
                        let imgUrl = imgElement.getAttribute('src') || imgElement.getAttribute('data-src');
                        if (imgUrl) {
                            // Set the app icon to the fetched image URL
                            document.getElementById('app-icon').src = imgUrl;
                        }
                    }

                    // Clean up the iframe
                    document.body.removeChild(iframe);
                };

                // Set the iframe's src to the app URL
                iframe.src = url;
            } catch (error) {
                console.error('Error fetching app icon:', error);
            }
        }

        // Call the function with the app's URL
        fetchAppIcon("{{ app.url }}");

    </script>

</body>
</html>
