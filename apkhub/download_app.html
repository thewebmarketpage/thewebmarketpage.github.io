<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        .app-icon {
            width: 75px;
            height: 75px;
            border-radius: 15px;
            object-fit: cover;
            margin: 10px 0;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #888;
        }
        .icon-loading {
            width: 75px;
            height: 75px;
            background: #f0f0f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1 id="app-title">Loading...</h1>
    <div id="app-icon-container">
        <div class="icon-loading">Loading icon...</div>
    </div>
    <p><strong>Version:</strong> <span id="app-version">Loading...</span></p>
    <p><strong>Author:</strong> <span id="app-author">Loading...</span></p>
    <p><strong>About:</strong> <span id="app-header">Loading...</span></p>
    <p id="app-article">Loading...</p>

    <a id="download-btn" class="download-btn" href="#" target="_blank">Download App</a>

    <div id="loading">Loading apps...</div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('https://giantwebmarket.com/apkhub/apkhubdata.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error loading apps:', error);
                document.getElementById('loading').innerHTML = 'Error loading apps. Please try again later.';
                return [];
            }
        }

        // Function to extract icon URL from app page
        async function extractIconUrl(appPageUrl) {
            try {
                // Use a CORS proxy if needed (many app stores block direct fetching)
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const response = await fetch(proxyUrl + appPageUrl);
                const html = await response.text();
                
                // Create a DOM parser to extract the icon
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Find the avatar div and extract the image URL
                const avatarDiv = doc.querySelector('.avatar img');
                if (avatarDiv) {
                    // Prefer data-src if available (common with lazy loading)
                    return avatarDiv.getAttribute('data-src') || avatarDiv.src;
                }
                return null;
            } catch (error) {
                console.error('Error extracting icon:', error);
                return null;
            }
        }

        function assignUniqueIds(data) {
            return data.map((app, index) => {
                app.id = `app-${index + 1}`;
                return app;
            });
        }

        async function displayAppDetails(app) {
            document.getElementById('app-title').textContent = app.title || 'No title available';
            document.getElementById('app-version').textContent = app.version || 'No version available';
            document.getElementById('app-author').textContent = app.author || 'No author available';
            document.getElementById('app-header').textContent = app.header || 'No description available';
            document.getElementById('app-article').textContent = app.article || 'No article available';
            document.getElementById('download-btn').href = app.download_url || '#';
            document.title = app.title || 'App Details';

            // Extract and display the icon
            if (app.source_url) {
                const iconUrl = await extractIconUrl(app.source_url);
                const iconContainer = document.getElementById('app-icon-container');
                
                if (iconUrl) {
                    iconContainer.innerHTML = `<img src="${iconUrl}" class="app-icon" alt="${app.title} icon">`;
                } else {
                    iconContainer.innerHTML = '<div class="icon-loading">Icon not available</div>';
                }
            } else {
                document.getElementById('app-icon-container').innerHTML = '<div class="icon-loading">No source URL provided</div>';
            }

            document.getElementById('loading').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const appId = new URLSearchParams(window.location.search).get('id');
            if (appId) {
                const allApps = await fetchData();
                const appsWithIds = assignUniqueIds(allApps);
                const app = appsWithIds.find(a => a.id === appId);

                if (app) {
                    await displayAppDetails(app);
                } else {
                    document.getElementById('loading').innerHTML = 'App not found.';
                }
            } else {
                document.getElementById('loading').innerHTML = 'No app ID provided.';
            }
        });
    </script>

</body>
</html>
